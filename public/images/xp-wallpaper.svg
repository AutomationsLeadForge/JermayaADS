<?xml version="1.0" encoding="UTF-8"?>
<!-- Static background: sky + stars + moon + mountain range + ground.
     Clouds and trees are overlaid from AnimatedBackground.tsx so they can parallax. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 240 135" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#081226"/>
      <stop offset="55%" stop-color="#112046"/>
      <stop offset="100%" stop-color="#1b2f66"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%"  stop-color="#dbe4f2" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#9fb0d6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#112046" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="240" height="135" fill="url(#nightSky)"/>

  <!-- Static baseline stars (AnimatedBackground adds twinkling ones on top) -->
  <g fill="#e8eef5">
    <rect x="8"   y="6"  width="1" height="1"/>
    <rect x="22"  y="14" width="1" height="1"/>
    <rect x="40"  y="8"  width="1" height="1"/>
    <rect x="58"  y="18" width="1" height="1"/>
    <rect x="80"  y="10" width="1" height="1"/>
    <rect x="96"  y="22" width="1" height="1"/>
    <rect x="116" y="6"  width="1" height="1"/>
    <rect x="134" y="18" width="1" height="1"/>
    <rect x="152" y="10" width="1" height="1"/>
    <rect x="170" y="24" width="1" height="1"/>
    <rect x="188" y="14" width="1" height="1"/>
    <rect x="208" y="8"  width="1" height="1"/>
    <rect x="226" y="20" width="1" height="1"/>
    <rect x="14"  y="30" width="1" height="1"/>
    <rect x="36"  y="38" width="1" height="1"/>
    <rect x="64"  y="32" width="1" height="1"/>
    <rect x="92"  y="42" width="1" height="1"/>
    <rect x="120" y="34" width="1" height="1"/>
    <rect x="148" y="40" width="1" height="1"/>
    <rect x="176" y="32" width="1" height="1"/>
    <rect x="200" y="44" width="1" height="1"/>
    <rect x="220" y="34" width="1" height="1"/>
  </g>

  <!-- Moon glow halo -->
  <circle cx="205" cy="22" r="20" fill="url(#moonGlow)"/>

  <!-- Moon — chunky pixel disc with craters -->
  <g>
    <rect x="196" y="12" width="18" height="2" fill="#c9d5e8"/>
    <rect x="193" y="14" width="24" height="2" fill="#d6dff0"/>
    <rect x="191" y="16" width="28" height="2" fill="#e0e7f3"/>
    <rect x="190" y="18" width="30" height="2" fill="#e8eef5"/>
    <rect x="189" y="20" width="32" height="4" fill="#eef3f9"/>
    <rect x="190" y="24" width="30" height="2" fill="#e0e7f3"/>
    <rect x="191" y="26" width="28" height="2" fill="#d6dff0"/>
    <rect x="193" y="28" width="24" height="2" fill="#c9d5e8"/>
    <rect x="196" y="30" width="18" height="2" fill="#b8c5da"/>
    <!-- Craters -->
    <rect x="198" y="18" width="3" height="2" fill="#a3b1cd" opacity="0.8"/>
    <rect x="212" y="23" width="4" height="3" fill="#a3b1cd" opacity="0.8"/>
    <rect x="202" y="26" width="3" height="2" fill="#a3b1cd" opacity="0.6"/>
  </g>

  <!-- Farthest mountain layer (darkest blue) -->
  <g fill="#1a2850">
    <polygon points="0,90 16,72 34,86 52,68 72,84 92,64 114,82 138,72 158,86 180,64 202,82 222,74 240,88 240,95 0,95"/>
  </g>

  <!-- Middle mountain layer (lighter, snow-capped peaks) -->
  <g fill="#2e4878">
    <!-- Peak 1 -->
    <polygon points="6,85 24,62 38,85"/>
    <!-- Peak 2 (tallest) -->
    <polygon points="34,85 60,46 84,85"/>
    <!-- Peak 3 -->
    <polygon points="78,85 100,56 122,85"/>
    <!-- Peak 4 -->
    <polygon points="116,85 138,52 158,85"/>
    <!-- Peak 5 -->
    <polygon points="152,85 178,50 204,85"/>
    <!-- Peak 6 -->
    <polygon points="196,85 216,62 234,85"/>
  </g>

  <!-- Snow caps on middle peaks -->
  <g fill="#c8daf2">
    <polygon points="24,62 21,68 27,68"/>
    <polygon points="60,46 54,60 66,60"/>
    <polygon points="100,56 94,66 106,66"/>
    <polygon points="138,52 132,64 144,64"/>
    <polygon points="178,50 170,62 186,62"/>
    <polygon points="216,62 211,68 221,68"/>
  </g>

  <!-- Snow texture streaks down the peaks -->
  <g fill="#8fa6d0" opacity="0.85">
    <rect x="58" y="52" width="2" height="18"/>
    <rect x="61" y="56" width="2" height="20"/>
    <rect x="98" y="62" width="2" height="14"/>
    <rect x="138" y="58" width="2" height="16"/>
    <rect x="176" y="56" width="2" height="18"/>
  </g>

  <!-- Closest mountain silhouette (darker, lower-lying) -->
  <g fill="#0c1634">
    <polygon points="0,98 12,88 28,96 44,84 62,94 80,82 98,94 118,86 136,96 156,84 178,94 198,86 220,96 240,90 240,108 0,108"/>
  </g>

  <!-- Dark ground base -->
  <rect x="0" y="105" width="240" height="30" fill="#050a1f"/>
  <rect x="0" y="104" width="240" height="1" fill="#1a2c5a"/>

  <!-- Faint ground texture -->
  <g fill="#1a2c5a" opacity="0.5">
    <rect x="20"  y="118" width="1" height="1"/>
    <rect x="62"  y="128" width="1" height="1"/>
    <rect x="110" y="122" width="1" height="1"/>
    <rect x="158" y="130" width="1" height="1"/>
    <rect x="200" y="120" width="1" height="1"/>
  </g>
</svg>
